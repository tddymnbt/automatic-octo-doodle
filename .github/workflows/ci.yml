name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # CI tests never need real credentials; unit tests use mocks/fakes.
  # DRY_RUN stays true so nothing is ever published from CI.
  DRY_RUN: 'true'
  TTS_PROVIDER: kokoro

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install FFmpeg and espeak-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q --tb=short

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Secret scan
        run: python scripts/scan_secrets.py

      - name: Validate project structure (no secrets required)
        # validate_environment fails on missing secrets; only run the
        # structure/config checks that don't need credentials. Avoid
        # load_dotenv() with no args — when running via `python - <<'PY'`
        # there is no backing file frame and find_dotenv() asserts.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from src.config import settings
          issues = settings.validate_config()
          if issues:
              print("Config issues:", issues)
              sys.exit(1)
          print("Config OK (secrets intentionally not required in CI)")
          PY